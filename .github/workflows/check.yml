name: Check

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test
        env:
          CARD_ENCRYPTION_KEY: test-key-that-is-long-enough-to-pass-0123456789
