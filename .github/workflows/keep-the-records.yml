name: Keep the call records

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: keep-the-records
  cancel-in-progress: false

jobs:
  sweep:
    name: Ask for anything not kept yet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Is the app on?
        id: on
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          id=$(curl -sS -f -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services?name=one-percent-app&limit=100" \
            | jq -r 'map(.service) | map(select(.name == "one-percent-app")) | .[0].id // empty')
          state=$(curl -sS -f -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/${id}" | jq -r '.suspended')
          if [ "$state" = suspended ]; then echo "on=no" >> "$GITHUB_OUTPUT"; echo "App is off; skipped."; else echo "on=yes" >> "$GITHUB_OUTPUT"; fi

      - name: Sweep
        if: steps.on.outputs.on == 'yes'
        env:
          APP_URL: https://app.farahbrunache.com
          SWEEP_SECRET: ${{ secrets.SWEEP_SECRET }}
        run: |
          set -euo pipefail
          [ -n "$SWEEP_SECRET" ] || { echo "::error title=SWEEP_SECRET is not set::The job cannot prove itself."; exit 1; }

          answer=$(curl -sS --fail-with-body --max-time 120 \
            -X POST "$APP_URL/api/sweep?action=records" \
            -H "authorization: Bearer $SWEEP_SECRET") || {
            echo "::error title=The sweep was refused::It answered: $answer"
            exit 1
          }

          echo "$answer" | jq .

          missed=$(printf '%s' "$answer" | jq '.missed | length')
          if [ "$missed" -gt 0 ]; then
            echo "::warning title=${missed} call record(s) could not be kept::$(printf '%s' "$answer" | jq -c '.missed')"
          fi

          {
            echo "## Call records"
            echo
            printf '%s' "$answer" | jq -r '"Looked at \(.looked), kept \(.kept), missed \(.missed | length)."'
          } >> "$GITHUB_STEP_SUMMARY"
