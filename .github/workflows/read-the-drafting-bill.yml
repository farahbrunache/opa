name: Read the drafting bill

on:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:

concurrency:
  group: read-the-drafting-bill
  cancel-in-progress: false

jobs:
  bill:
    name: Ask what drafting billed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read it
        env:
          APP_URL: https://app.farahbrunache.com
          SWEEP_SECRET: ${{ secrets.SWEEP_SECRET }}
        run: |
          set -euo pipefail
          [ -n "$SWEEP_SECRET" ] || { echo "::error title=SWEEP_SECRET is not set::The job cannot prove itself."; exit 1; }

          answer=$(curl -sS --fail-with-body --max-time 120 \
            -X POST "$APP_URL/api/drafting-bill" \
            -H "authorization: Bearer $SWEEP_SECRET")

          days=$(printf '%s' "$answer" | sed -E 's/.*"days":([0-9]+).*/\1/')
          echo "Days of billing written or revised: ${days:-unknown}" >> "$GITHUB_STEP_SUMMARY"
