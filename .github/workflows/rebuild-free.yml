# Runs once, then this file and its script are removed.
name: Rebuild on free plan

on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: bash .github/scripts/rebuild-free.sh
