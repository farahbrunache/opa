<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<script>try { var t = document.cookie.match(/(?:^|; )op_theme=(light|dark)(?:;|$)/); if (t) document.documentElement.dataset.theme = t[1]; } catch (e) {}</script>
<title>Your session — One Percent</title>
<link rel="stylesheet" href="/fonts.css">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/client.css">
</head>
<body class="client">
<main class="wrap">

  <div class="topbar">
    <a class="back" href="https://farahbrunache.com">&larr; farahbrunache.com</a>
    <div class="ctheme" role="group" aria-label="Theme">
      <button type="button" data-pick="light" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Light</button>
      <button type="button" data-pick="dark" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>Dark</button>
    </div>
  </div>

  <div id="body" aria-live="polite"></div>

  <footer class="cterms">
    <p><b>Save this link.</b> It's the only record of your order. Nothing else points back to it.</p>
    <p class="mono pagelink" id="pagelink"></p>
    <button type="button" class="cbtn ghost" id="copylink">Copy this page's link</button>
    <p>Lost it? <a href="/buy">Recover it on the Pay page</a> with your reference or your gift card code.</p>
  </footer>

</main>

<script type="module" src="/client-theme.js"></script>
<script type="module">
  import { call, localProblem, showProblem } from '/problem.js';
  import { callBox } from '/claim-call.js';
  import { FARAH, day, dayTime, linkedText } from '/client-ui.js';
  import { firstSentence, sheetSteps } from '/sheet.js';

  const body = document.getElementById('body');
  const params = new URLSearchParams(location.search);
  const token = params.get('t');
  const backFromSignIn = params.get('in') === '1';
  const own = token ? `/claim?t=${encodeURIComponent(token)}` : location.pathname;
  if (backFromSignIn) history.replaceState({}, '', own);

  function el(tag, text, className) {
    const node = document.createElement(tag);
    if (text) node.textContent = text;
    if (className) node.className = className;
    return node;
  }

  function hero(eyebrow, title, lede) {
    const head = el('header', null, 'chero sm');
    const seal = el('div', '1%', 'cmark');
    seal.setAttribute('aria-hidden', 'true');
    head.append(seal, el('p', `One Percent · ${eyebrow}`, 'ceyebrow'), el('h1', title));
    if (lede) head.append(el('p', lede, 'clede'));
    body.append(head);
  }

  function panel(...nodes) {
    const box = el('section', null, 'cpanel');
    box.append(...nodes);
    body.append(box);
    return box;
  }

  function button(label, href, tone) {
    const a = el('a', label, tone ? `cbtn ${tone}` : 'cbtn');
    a.href = href;
    return a;
  }

  function status(text, tone) {
    const line = el('div', null, tone ? `cstatus ${tone}` : 'cstatus');
    line.append(el('i'), el(tone === 'bad' ? 'b' : 'span', text));
    return line;
  }

  function steps(items) {
    const list = el('ol', null, 'paysteps');
    for (const [lead, rest] of items) {
      const li = el('li');
      li.append(el('b', lead));
      if (rest) li.append(document.createTextNode(` ${rest}`));
      list.append(li);
    }
    return list;
  }

  function copyButton(label, text) {
    const b = el('button', label, 'cbtn');
    b.type = 'button';
    b.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(text);
        b.textContent = 'Copied';
      } catch {
        b.textContent = 'Select it and copy it';
      }
      setTimeout(() => { b.textContent = label; }, 2500);
    });
    return b;
  }

  function signInHref() {
    return `/api/auth?action=start&to=${encodeURIComponent(`${own}&in=1`)}`;
  }

  function sessionCard(data, chip, tone) {
    const card = el('div', null, 'sessmini');
    const minutes = data.callSeconds > 0 ? `${Math.max(1, Math.round(data.callSeconds / 60))} min` : null;
    card.append(el('b', data.reference, 'mono'), el('span', chip, tone ? `cchip ${tone}` : 'cchip'),
      el('small', ['Call', day(data.calledAt), minutes].filter(Boolean).join(' · ')));
    return card;
  }

  function keepPanel() {
    if (document.getElementById('keep')) return;
    const box = el('section', null, 'signin');
    box.id = 'keep';
    box.append(el('p', 'Optional', 'clabel'), el('h2', 'Keep this session on an account', 'ch2'),
      el('p', "Sign in with Skills Economy and this session is saved to your account, so you don't "
        + 'have to keep this link. Signing in changes nothing about what you already have.', 'ctext'),
      button('Sign in with Skills Economy', signInHref(), 'ghost'));
    body.append(box);
  }

  function signInVideo() {
    const figure = el('figure', null, 'cvideo');
    const video = el('video');
    video.controls = true;
    video.playsInline = true;
    video.preload = 'none';
    video.poster = '/media/link-your-session.jpg';
    video.src = '/media/link-your-session.mp4';
    figure.append(video, el('figcaption', 'Watch what signing in with Skills Economy does: your '
      + 'session stays on your account. No sound.', 'cfine'));
    body.append(figure);
  }

  function pending(data) {
    if (data.method === 'amazon') {
      hero('Your order', 'Your gift card is in. A person checks it.',
        "It isn't instant. Come back to this page: the button to start your call appears here once "
          + 'the card is matched.');
      panel(status('Gift card received · being checked'),
        el('p', 'Nothing gets sent to you, because nothing about you was saved. This page is the '
          + 'only place the answer shows up.', 'ctext'));
      return;
    }
    hero('Your order', 'Pay $7 on Wise to book your call.',
      'Put the 10-character reference below in the Wise note. Once a person matches the payment, '
        + 'the button to start your call appears on this page.');
    panel(el('p', 'Your reference', 'clabel'), el('div', data.reference, 'refbig'),
      copyButton('Copy the reference', data.reference),
      el('p', 'Put it in the Wise note. Wise calls it a reference, a note or a message, depending on '
        + "the screen. It's the only thing that tells a person the $7 is yours.", 'ctext'));

    const first = el('li');
    if (data.payTo && /^https?:\/\//i.test(data.payTo)) {
      first.append(el('b', 'Open the Wise payment page and send $7. '));
      const a = el('a', data.payTo, 'mono');
      a.href = data.payTo;
      a.rel = 'noopener noreferrer';
      a.target = '_blank';
      first.append(a);
    } else if (data.payTo) {
      first.append(el('b', 'Open Wise and send $7 to '), el('b', data.payTo, 'mono'), el('b', '.'));
    } else {
      first.append(el('b', 'Open Wise and send $7.'));
    }
    const list = steps([
      ['Paste the reference', 'where Wise asks for a reference, a note or a message.'],
      ['Come back to this page.', 'Nothing gets sent to you, because nothing about you was saved.'],
    ]);
    list.prepend(first);
    panel(el('p', 'Where to send $7', 'clabel'), list, status('Waiting for $7 with this reference'));
  }

  function rejected(data) {
    hero('Your order', "This order didn't go through.");
    panel(el('p', 'What happened', 'clabel'), status(data.reason, 'bad'),
      el('p', 'No session was opened and nothing was charged.', 'ctext'),
      button('Start a new order', '/buy'));
  }

  function ready(data) {
    hero('Your call', 'Your call is ready.',
      'Up to thirty minutes, in this browser. Nothing to install and no number to dial.');
    const what = el('ul', null, 'clist');
    const first = el('li');
    first.append(el('b', 'An automated assistant, not a person.'),
      document.createTextNode(' It says so in its first sentence, and that the call is recorded.'));
    what.append(first,
      el('li', "It goes through what you do, what you'd charge, who your first customer is, and one thing to do next."),
      el('li', 'Up to thirty minutes. A short call is a finished one.'),
      el('li', 'A person reads everything it writes down.'));
    panel(el('p', 'What the call is', 'clabel'), what);
    const box = el('div', null, 'callbox');
    box.setAttribute('aria-live', 'polite');
    body.append(box);
    callBox(box, { token, status: data, changed: render, ended: afterCall });
  }

  function afterCall() {
    body.querySelector('.chero h1').textContent = 'Your call is done.';
    body.querySelector('.chero .clede')?.remove();
    keepPanel();
  }

  function sheetPanel(data) {
    const parts = sheetSteps(data.steps);
    const box = panel();
    const head = el('div', null, 'chead');
    head.append(el('p', 'Your next steps', 'clabel'), el('span', `Written for you · ${day(data.stepsAt)}`, 'cdate'));
    box.append(head);
    if (parts.intro) box.append(linkedText(el('p', null, 'ctext'), parts.intro));
    const list = el('ol', null, 'csteps');
    parts.steps.forEach((text, i) => {
      const card = el('div', null, 'cstep static');
      card.append(el('span', String(i + 1), 'cn'));
      const words = el('span', null, 'ctx');
      const [first, rest] = firstSentence(text);
      words.append(linkedText(el('b'), first));
      linkedText(words, rest);
      card.append(words);
      const li = el('li');
      li.append(card);
      list.append(li);
    });
    if (parts.steps.length) box.append(list);
    if (parts.outro) box.append(linkedText(el('p', null, 'ctext'), parts.outro));
  }

  function messagesPanel(messages) {
    const box = panel();
    const head = el('div', null, 'chead');
    head.append(el('p', `You and ${FARAH}`, 'clabel'), el('span', 'Private', 'cdate'));
    const list = el('div', null, 'cthread');
    for (const message of messages) {
      if (message.author === 'auto') {
        list.append(el('div', `${message.body} · ${day(message.at)}`, 'cnote'));
        continue;
      }
      const line = el('div', null, 'cm farah');
      line.append(el('span', message.author === 'opening' ? 'To start with' : FARAH, 'by'),
        el('p', message.body), el('time', dayTime(message.at)));
      list.append(line);
    }
    box.append(head, list);
  }

  function delivered(data) {
    hero('Your session', data.steps ? 'Your next steps are written.' : `${FARAH} wrote to you.`);
    if (data.steps) sheetPanel(data);
    if (data.messages?.length) messagesPanel(data.messages);
    const keep = el('section', null, 'signin');
    keep.append(el('p', 'To write back', 'clabel'),
      el('p', `Sign in with Skills Economy to tick steps off and write back to ${FARAH}. `
        + 'This link keeps working either way.', 'ctext'),
      button('Sign in with Skills Economy', signInHref()));
    body.append(keep);
    signInVideo();
    panel(sessionCard(data, data.steps ? 'Written' : 'Being read', data.steps ? 'ok' : undefined),
      button('Pay for another session', '/buy', 'text'));
  }

  function used(data) {
    if (data.steps || data.messages?.length) {
      delivered(data);
      return;
    }
    if (!data.recommended) {
      hero('Your session', 'Your call is done. A person is reading it.',
        'A person reads the call and writes what to do next. Come back in about 48 hours.');
      panel(sessionCard(data, 'Being read'),
        el('p', 'Nothing is needed from you. This link keeps working.', 'ctext'));
      signInVideo();
      keepPanel();
      return;
    }
    hero('Your session', 'Your next steps are written.',
      "They aren't shown on this page. Sign in with Skills Economy to read them.");
    signInVideo();
    panel(sessionCard(data, 'Written', 'ok'), button('Sign in with Skills Economy', signInHref()),
      button('Pay for another session', '/buy', 'text'));
  }

  function broken(problem) {
    hero('Your order', "This link doesn't open an order.",
      "It's missing part of its address, or the order isn't found.");
    const report = el('p', problem.report, 'creport');
    panel(steps([
      ['Open the full link.', "Links get cut off when they're copied or wrapped in a message. Copy all of it, from https to the end."],
      ['Or recover it on the Pay page.', 'Type your 10-character reference, or the gift card code you used. Either one gets you a new link.'],
    ]), button('Recover my link', '/buy'), report);
  }

  function render(data) {
    body.textContent = '';
    if (data.status === 'pending') pending(data);
    else if (data.status === 'rejected') rejected(data);
    else if (data.status === 'confirmed') ready(data);
    else if (data.status === 'used') used(data);
    else hero('Your order', "This order is in a state this page doesn't recognize.");
  }

  async function linkQuietly() {
    try {
      const response = await fetch('/api/client?action=link', { // quiet: silent by design
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ t: token }),
      });
      if (response.ok && backFromSignIn) location.replace('/');
    } catch {
    }
  }

  async function load() {
    if (!token) {
      broken(localProblem('', 'open_claim', 'no claim token in the address'));
      return;
    }
    try {
      const data = await call(`/api/status?t=${encodeURIComponent(token)}`, {}, 'Opening this page');
      try { localStorage.setItem('onepercent.claim', own); } catch {}
      render(data);
      linkQuietly();
    } catch (error) {
      body.textContent = '';
      if (error.status === 404 || error.status === 400) {
        broken(error);
        return;
      }
      hero('Your order', "This page didn't open.");
      const box = el('div');
      body.append(box);
      showProblem(box, error, 'Opening this page');
    }
  }

  document.getElementById('pagelink').textContent = new URL(own, location.origin).href;

  const copy = document.getElementById('copylink');
  copy.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(new URL(own, location.origin).href);
      copy.textContent = 'Copied';
    } catch {
      copy.textContent = 'Copy it from the address bar';
    }
    setTimeout(() => { copy.textContent = "Copy this page's link"; }, 2500);
  });

  load();
</script>
</body>
</html>
