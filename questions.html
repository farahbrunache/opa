<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Question lists — One Percent</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="/fonts.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="wrap inside">

  <div class="topbar">
    <a class="back" href="/desk">&larr; Desk</a>
    <button type="button" class="iconbtn" id="refresh">Refresh</button>
  </div>
  <h1>Question lists</h1>

  <div id="signin" hidden>
    <div class="actions"><a class="button go-on" id="lgo" href="/api/auth?action=start&amp;to=/questions">Sign in with Skills Economy</a></div>
  </div>

  <div id="msg" hidden></div>

  <div id="work" hidden>
    <div class="seg three" id="views" role="group" aria-label="View">
      <button type="button" class="plain" data-view="browse" aria-pressed="true">Browse</button>
      <button type="button" class="plain" data-view="add" aria-pressed="false">Add</button>
      <button type="button" class="plain" data-view="paste" aria-pressed="false">Paste a bank</button>
    </div>

    <div id="view-browse">
      <div class="box">
        <span class="cap" id="covhead"></span>
        <div class="tablewrap">
          <table class="cov">
            <thead><tr><th scope="col">Who it's for</th><th scope="col">All</th><th scope="col">Any</th><th scope="col">Offer</th><th scope="col">First</th><th scope="col">Steady</th><th scope="col">Further</th></tr></thead>
            <tbody id="coverage"></tbody>
          </table>
        </div>
      </div>
      <div class="box">
        <span class="cap" id="browsehead"></span>
        <form class="searchrow" id="searchform" role="search" novalidate>
          <label class="visually-hidden" for="q">Search the questions</label>
          <input type="search" id="q" placeholder="Search the questions" autocomplete="off" maxlength="80" enterkeyhint="search">
          <button type="submit" class="btn">Find</button>
        </form>
        <div class="chips" id="stagechips" role="group" aria-label="Stage"></div>
        <ul class="qe" id="rows"></ul>
        <div class="pager" id="pager"></div>
      </div>
    </div>

    <div class="box" id="view-add" hidden>
      <span class="cap">Add questions</span>
      <form class="fields" id="addform" novalidate>
        <div class="field">
          <label for="scope">Who it's for</label>
          <select id="scope"></select>
        </div>
        <div class="grid2">
          <div class="field">
            <label for="stage">Stage</label>
            <select id="stage"></select>
          </div>
          <div class="field">
            <label for="topic">Group, optional</label>
            <input id="topic" type="text" maxlength="60" list="topics" autocomplete="off">
            <datalist id="topics"></datalist>
          </div>
        </div>
        <div class="field">
          <label for="body">Questions, one a line</label>
          <textarea id="body" rows="4"></textarea>
        </div>
        <button type="submit" class="btn primary">Add</button>
      </form>
    </div>

    <div class="box" id="view-paste" hidden>
      <span class="cap">Paste a question bank</span>
      <form class="fields" id="importform" novalidate>
        <div class="field">
          <label for="bank">Sector headings, job title headings, stage headings, a dash before each question</label>
          <textarea id="bank" rows="6"></textarea>
        </div>
        <button type="submit" class="btn primary">Add what's new</button>
      </form>
    </div>
  </div>

</main>

<script type="module">
  import { el, msg, get, post } from '/desk-ui.js';
  import '/desk-top.js';

  let fields = 0;
  let data = null;
  const where = { group: '', stage: '', q: '', page: 1, view: 'browse' };

  const scopeValue = (q) => (q.tradeId ? `t:${q.tradeId}` : q.sectorId ? `s:${q.sectorId}` : '');

  function fillScopes(select, listing) {
    select.textContent = '';
    const everyone = el('option', 'Everyone');
    everyone.value = '';
    select.append(everyone);
    for (const sector of listing.sectors) {
      const group = document.createElement('optgroup');
      group.label = sector.name;
      const all = el('option', `All of ${sector.name}`);
      all.value = `s:${sector.id}`;
      group.append(all);
      for (const trade of sector.trades) {
        const option = el('option', trade.title);
        option.value = `t:${trade.id}`;
        group.append(option);
      }
      select.append(group);
    }
  }

  function scopeBody(value) {
    if (value.startsWith('t:')) return { trade: value.slice(2) };
    if (value.startsWith('s:')) return { sector: value.slice(2) };
    return {};
  }

  async function load() {
    const params = new URLSearchParams({ group: where.group, stage: where.stage, q: where.q, page: String(where.page) });
    data = await get(`questions&${params.toString()}`);
    render();
  }

  function editor(question, row) {
    const n = ++fields;
    const form = el('form', null, 'fields');
    form.noValidate = true;

    const words = el('div', null, 'field');
    const wordsLabel = el('label', 'Question');
    wordsLabel.htmlFor = `ebody${n}`;
    const body = document.createElement('textarea');
    body.id = `ebody${n}`;
    body.rows = 3;
    body.maxLength = 300;
    body.value = question.body;
    words.append(wordsLabel, body);

    const who = el('div', null, 'field');
    const whoLabel = el('label', "Who it's for");
    whoLabel.htmlFor = `escope${n}`;
    const scope = document.createElement('select');
    scope.id = `escope${n}`;
    fillScopes(scope, data);
    scope.value = scopeValue(question);
    who.append(whoLabel, scope);

    const grid = el('div', null, 'grid2');
    const when = el('div', null, 'field');
    const whenLabel = el('label', 'Stage');
    whenLabel.htmlFor = `estage${n}`;
    const stage = document.createElement('select');
    stage.id = `estage${n}`;
    for (const s of data.stages) {
      const option = el('option', s.label);
      option.value = s.stage;
      stage.append(option);
    }
    stage.value = question.stage;
    when.append(whenLabel, stage);

    const groupField = el('div', null, 'field');
    const groupLabel = el('label', 'Group, optional');
    groupLabel.htmlFor = `etopic${n}`;
    const topic = document.createElement('input');
    topic.id = `etopic${n}`;
    topic.type = 'text';
    topic.maxLength = 60;
    topic.autocomplete = 'off';
    topic.setAttribute('list', 'topics');
    topic.value = question.topic || '';
    groupField.append(groupLabel, topic);
    grid.append(when, groupField);

    const actions = el('div', null, 'pair');
    const save = el('button', 'Save', 'btn primary small');
    save.type = 'submit';
    const cancel = el('button', 'Cancel', 'btn ghost small');
    cancel.type = 'button';
    cancel.addEventListener('click', () => form.closest('li').replaceWith(row));
    actions.append(save, cancel);

    form.append(words, who, grid, actions);
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      save.disabled = true;
      try {
        await post('question-edit', {
          question: question.id, stage: stage.value, topic: topic.value, body: body.value, ...scopeBody(scope.value),
        });
        await load();
      } catch (error) {
        msg('msg', error.message, 'bad');
        save.disabled = false;
      }
    });
    const item = el('li');
    item.append(form);
    return item;
  }

  function questionRow(question) {
    const row = el('li');
    const words = el('span', question.body);
    if (question.topic) words.append(' ', el('span', question.topic, 'tag'));
    if (where.stage === '' && question.stage !== 'any') {
      words.append(' ', el('span', data.stages.find((s) => s.stage === question.stage)?.label || question.stage, 'tag'));
    }
    if (question.isDemo) words.append(' ', el('span', 'Demo', 'tag t-demo'));
    const acts = el('span', null, 'acts');
    const edit = el('button', 'Edit', 'btn ghost small');
    edit.type = 'button';
    edit.addEventListener('click', () => row.replaceWith(editor(question, row)));
    const remove = el('button', 'Delete', 'btn danger small');
    remove.type = 'button';
    remove.addEventListener('click', async () => {
      if (!window.confirm('Delete this question? Anywhere it was already asked, the conversation keeps it.')) return;
      remove.disabled = true;
      try {
        await post('question-delete', { question: question.id });
        await load();
      } catch (error) {
        msg('msg', error.message, 'bad');
        remove.disabled = false;
      }
    });
    acts.append(edit, remove);
    row.append(words, acts);
    return row;
  }

  function renderCoverage() {
    document.getElementById('covhead').textContent = `Coverage · ${data.total} question${data.total === 1 ? '' : 's'}`;
    const body = document.getElementById('coverage');
    body.textContent = '';
    for (const group of data.coverage) {
      const tr = el('tr', null, [group.low ? 'low' : null, group.key === where.group ? 'on' : null].filter(Boolean).join(' ') || null);
      tr.tabIndex = 0;
      tr.setAttribute('role', 'button');
      const name = el('td', group.label);
      tr.append(name, el('td', String(group.all)));
      for (const stage of data.stages) {
        const n = group.stages[stage.stage];
        tr.append(el('td', String(n), n === 0 && stage.stage !== 'any' ? 'zero' : null));
      }
      const go = () => {
        where.group = group.key;
        where.stage = '';
        where.page = 1;
        load();
      };
      tr.addEventListener('click', go);
      tr.addEventListener('keydown', (event) => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); go(); } });
      body.append(tr);
    }
  }

  function renderBrowse() {
    const browse = data.browse;
    const groupLabel = data.coverage.find((g) => g.key === browse.group)?.label || 'Everyone';
    const stageLabel = browse.stage ? data.stages.find((s) => s.stage === browse.stage)?.label : 'Every stage';
    document.getElementById('browsehead').textContent = `Browsing · ${groupLabel} · ${stageLabel}`;
    document.getElementById('q').value = browse.q;
    const chips = document.getElementById('stagechips');
    chips.textContent = '';
    for (const stage of [{ stage: '', label: 'Every stage' }, ...data.stages]) {
      const chip = el('button', stage.label, 'chip');
      chip.type = 'button';
      chip.setAttribute('aria-pressed', String(stage.stage === browse.stage));
      chip.addEventListener('click', () => {
        where.stage = stage.stage;
        where.page = 1;
        load();
      });
      chips.append(chip);
    }
    const rows = document.getElementById('rows');
    rows.textContent = '';
    if (!browse.questions.length) rows.append(el('li', 'Nothing here yet.', 'empty'));
    for (const question of browse.questions) rows.append(questionRow(question));
    const pager = document.getElementById('pager');
    pager.textContent = '';
    const first = browse.total ? (browse.page - 1) * browse.perPage + 1 : 0;
    const upTo = Math.min(browse.page * browse.perPage, browse.total);
    const newer = el('button', 'Newer', 'btn ghost small');
    newer.type = 'button';
    newer.disabled = browse.page <= 1;
    newer.addEventListener('click', () => { where.page = browse.page - 1; load(); });
    const older = el('button', 'Older', 'btn ghost small');
    older.type = 'button';
    older.disabled = browse.page >= browse.last;
    older.addEventListener('click', () => { where.page = browse.page + 1; load(); });
    pager.append(newer, el('span', browse.total ? `${first}–${upTo} of ${browse.total}` : '0 of 0', 'faint'), older);
  }

  function render() {
    fillScopes(document.getElementById('scope'), data);
    const topics = document.getElementById('topics');
    topics.textContent = '';
    for (const topic of data.topics) {
      const option = document.createElement('option');
      option.value = topic;
      topics.append(option);
    }
    const picker = document.getElementById('stage');
    picker.textContent = '';
    for (const stage of data.stages) {
      const option = el('option', stage.label);
      option.value = stage.stage;
      picker.append(option);
    }
    renderCoverage();
    renderBrowse();
  }

  function showView(view) {
    where.view = view;
    for (const button of document.querySelectorAll('#views [data-view]')) {
      button.setAttribute('aria-pressed', String(button.dataset.view === view));
    }
    for (const name of ['browse', 'add', 'paste']) document.getElementById(`view-${name}`).hidden = name !== view;
  }
  for (const button of document.querySelectorAll('#views [data-view]')) {
    button.addEventListener('click', () => showView(button.dataset.view));
  }

  document.getElementById('searchform').addEventListener('submit', (event) => {
    event.preventDefault();
    where.q = document.getElementById('q').value.trim();
    where.page = 1;
    load();
  });

  document.getElementById('importform').addEventListener('submit', async (event) => {
    event.preventDefault();
    const button = event.submitter;
    if (button) button.disabled = true;
    try {
      const out = await post('questions-import', { text: document.getElementById('bank').value });
      const said = [`${out.added} added`, `${out.skipped} already there`];
      if (out.unknown.length) said.push(`not in the taxonomy copy, skipped: ${out.unknown.join('; ')}`);
      msg('msg', said.join(' · '), out.unknown.length ? 'bad' : 'good');
      document.getElementById('bank').value = '';
      showView('browse');
      await load();
    } catch (error) {
      msg('msg', error.message, 'bad');
    } finally {
      if (button) button.disabled = false;
    }
  });

  document.getElementById('addform').addEventListener('submit', async (event) => {
    event.preventDefault();
    const button = event.submitter;
    if (button) button.disabled = true;
    try {
      const out = await post('question-add', {
        stage: document.getElementById('stage').value,
        topic: document.getElementById('topic').value,
        body: document.getElementById('body').value,
        ...scopeBody(document.getElementById('scope').value),
      });
      document.getElementById('body').value = '';
      msg('msg', `${out.ids.length} added.`, 'good');
      where.group = document.getElementById('scope').value;
      where.stage = document.getElementById('stage').value;
      where.page = 1;
      showView('browse');
      await load();
    } catch (error) {
      msg('msg', error.message, 'bad');
    } finally {
      if (button) button.disabled = false;
    }
  });

  document.getElementById('refresh').addEventListener('click', () => load().catch((error) => msg('msg', error.message, 'bad')));

  try {
    await load();
    document.getElementById('work').hidden = false;
  } catch (error) {
    if (error.status === 401) {
      document.getElementById('signin').hidden = false;
    } else {
      msg('msg', error.message, 'bad');
    }
  }
</script>
</body>
</html>
